[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Django migrations are auto-generated; don't lint their formatting or imports.
"**/migrations/*.py" = ["E501", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["web"]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
