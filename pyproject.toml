[tool.ruff]
target-version = "py312"
line-length = 88
# SDD artifacts under openspec/ are documentation (prose + illustrative Python
# snippets), not source. ruff format rewrites embedded code blocks and would
# otherwise fail --check on every design doc.
extend-exclude = ["openspec/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Django migrations are auto-generated; don't lint their formatting or imports.
"**/migrations/*.py" = ["E501", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not e2e'"
pythonpath = ["web"]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
markers = [
    "e2e: dev-only browser smoke (Playwright); requires `playwright install chromium`, deselected in CI",
]

[tool.coverage.run]
# Measure both trees. Per-scope gates are authoritative: the web gate keeps
# the 85% floor on `web/*`, while diff-cover protects changed `src/` lines.
source = ["web", "src"]
omit = [
    "web/manage.py",
    "web/config/wsgi.py",
    "web/config/asgi.py",
    "*/migrations/*",
]
