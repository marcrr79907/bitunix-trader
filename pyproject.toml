[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Django migrations are auto-generated; don't lint their formatting or imports.
"**/migrations/*.py" = ["E501", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["web"]
DJANGO_SETTINGS_MODULE = "config.settings.dev"

[tool.coverage.run]
# Measure the code this project owns. `src/` (legacy CLI) is covered
# incrementally as later changes touch those modules; the web app is gated.
source = ["web"]
omit = [
    "web/manage.py",
    "web/config/wsgi.py",
    "web/config/asgi.py",
    "*/migrations/*",
]

[tool.coverage.report]
fail_under = 85
