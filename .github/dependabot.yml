version: 2
updates:
  - package-ecosystem: pip
    directory: /
    # Dependencies land on the integration branch, then flow to main via release.
    # The default branch (main) lags develop and must not receive ad-hoc bumps.
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
