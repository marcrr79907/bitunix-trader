name: CI

on:
  pull_request:
  # Invoked by cd.yml as the quality gate before any deploy, so every deploy
  # runs this exact suite first. CD passes publish=true to also push the image.
  workflow_call:
    inputs:
      publish:
        description: Build and push the image to GHCR (CD only)
        type: boolean
        default: false
      image_tag:
        description: Tag to apply to the published image (e.g. the git SHA)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: L1 lint & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Django system check
        run: python web/manage.py check

      - name: Migration drift check
        run: python web/manage.py makemigrations --check --dry-run

      - name: Tests with coverage gate
        run: python -m pytest --cov

  core-isolation:
    name: L1 core imports without Django
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime deps only (no Django)
        run: |
          pip install --upgrade pip
          pip install requests rich

      - name: Import every core module with Django absent
        run: |
          python - <<'PY'
          import importlib, pathlib, sys
          assert "django" not in sys.modules
          for path in sorted(pathlib.Path("src").glob("*.py")):
              if path.stem == "__init__":
                  continue
              importlib.import_module(f"src.{path.stem}")
          print("core imports clean without Django")
          PY

  security:
    name: L1 security scans
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Dependency CVE audit
        run: |
          pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: L2 build & compose config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate docker compose config
        run: docker compose config

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (PR / no publish)
        if: inputs.publish != true
        run: docker build -t bitunix-trader:ci .

      - name: Log in to GHCR
        if: inputs.publish == true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (CD)
        if: inputs.publish == true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
