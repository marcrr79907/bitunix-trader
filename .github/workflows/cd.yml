name: CD

# Deploy is driven by Git, not by Railway's GitHub autodeploy (disabled):
#   push to develop  -> staging
#   push of a vX.Y.Z tag -> production
# CI runs first as a gate (reusable workflow); the image is published to GHCR
# and the service is pointed at that immutable tag, so the artifact tested is
# the artifact deployed. A post-deploy /healthz smoke proves it is live.

on:
  push:
    branches: [develop]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Gate (CI)
    uses: ./.github/workflows/ci.yml
    with:
      publish: true
      image_tag: ${{ github.sha }}

  deploy:
    name: Deploy
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve environment
        id: env
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=production" >> "$GITHUB_OUTPUT"
            if ! echo "${{ github.ref_name }}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::tag '${{ github.ref_name }}' is not strict semver (vX.Y.Z)"
              exit 1
            fi
          else
            echo "name=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify commit is on the deploy branch
        run: |
          set -euo pipefail
          git fetch --no-tags origin main develop
          target="${{ steps.env.outputs.name }}"
          if [ "$target" = "production" ]; then
            base=main
          else
            base=develop
          fi
          # The commit being deployed must be reachable from its branch.
          if ! git merge-base --is-ancestor "${{ github.sha }}" "origin/$base"; then
            echo "::error::${{ github.sha }} is not on origin/$base; refusing to deploy"
            exit 1
          fi
          echo "OK: ${{ github.sha }} is on origin/$base"

      - name: Deploy image to Railway
        env:
          # Project token scoped to a single environment (least privilege).
          TOKEN: ${{ steps.env.outputs.name == 'production' && secrets.RAILWAY_TOKEN_PROD || secrets.RAILWAY_TOKEN_STAGING }}
          PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
          # Needed only while the GHCR package is private (PAT with read:packages).
          REG_USER: ${{ secrets.GHCR_USER }}
          REG_PASS: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$TOKEN" ] || { echo "::error::Railway project token not set for ${{ steps.env.outputs.name }}"; exit 1; }
          [ -n "$PROJECT_ID" ] || { echo "::error::RAILWAY_PROJECT_ID not set"; exit 1; }

          # Resolve the environment id for this project token.
          ENV_ID=$(curl -sf https://backboard.railway.com/graphql/v2 \
            -H "Project-Access-Token: $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"query { projectToken { environmentId } }"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['projectToken']['environmentId'])")
          echo "environment: $ENV_ID"

          # Registry credentials are attached only if provided (private GHCR).
          if [ -n "$REG_USER" ] && [ -n "$REG_PASS" ]; then
            REG_CREDS=", registryCredentials: { username: \"$REG_USER\", password: \"$REG_PASS\" }"
          else
            REG_CREDS=""
          fi

          for svc in web worker scheduler; do
            SVC_ID=$(curl -sf "https://backboard.railway.com/graphql/v2" \
              -H "Project-Access-Token: $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"query\":\"query { project(id: \\\"$PROJECT_ID\\\") { services { edges { node { id name } } } } }\"}" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(next(n['node']['id'] for n in d['data']['project']['services']['edges'] if n['node']['name']=='$svc'))")
            echo "deploying $svc ($SVC_ID) -> $IMAGE"
            curl -sf https://backboard.railway.com/graphql/v2 \
              -H "Project-Access-Token: $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"query\":\"mutation { serviceInstanceUpdate(serviceId: \\\"$SVC_ID\\\", environmentId: \\\"$ENV_ID\\\", input: { source: { image: \\\"$IMAGE\\\" }$REG_CREDS }) }\"}" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('errors') or ('updated' if d['data']['serviceInstanceUpdate'] else 'no-op'))"
          done

      - name: Resolve target URL
        id: url
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          PROD_URL: ${{ secrets.PROD_URL }}
        run: |
          if [ "${{ steps.env.outputs.name }}" = "production" ]; then
            echo "url=$PROD_URL" >> "$GITHUB_OUTPUT"
          else
            echo "url=$STAGING_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for deploy to settle
        if: steps.url.outputs.url != ''
        run: sleep 45

      - name: Smoke /healthz
        if: steps.url.outputs.url != ''
        env:
          URL: ${{ steps.url.outputs.url }}
        run: |
          set -euo pipefail
          endpoint="${URL%/}/healthz"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$endpoint" || true)
            echo "attempt $attempt: $endpoint -> $code"
            if [ "$code" = "200" ]; then
              echo "smoke OK"
              exit 0
            fi
            sleep 15
          done
          echo "::error::deploy smoke failed for $endpoint (last code $code)"
          exit 1
