<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}bitunix-trader{% endblock %}</title>
  <link rel="stylesheet" href="{% url 'theme_css' %}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <span class="brand">bitunix-trader</span>
    <nav aria-label="Primary">
      <a href="{% url 'market_page' %}"{% if request.resolver_match.url_name == 'market_page' %} aria-current="page"{% endif %}>Market</a>
      <a href="{% url 'signals' %}"{% if request.resolver_match.url_name == 'signals' %} aria-current="page"{% endif %}>Signals</a>
      <a href="{% url 'rules' %}"{% if request.resolver_match.url_name == 'rules' %} aria-current="page"{% endif %}>Rules</a>
      <a href="/positions/">Positions</a>
      <a href="/journal/">Journal</a>
      <a href="{% url 'analytics' %}"{% if request.resolver_match.url_name == 'analytics' %} aria-current="page"{% endif %}>Analytics</a>
    </nav>
    {% if user.is_authenticated %}
      <span class="whoami">{{ user.email }}</span>
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Log out</button></form>
    {% else %}
      <a href="{% url 'login' %}">Log in</a>
    {% endif %}
  </header>
  <main>
  {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
