{% extends "registration/base.html" %}

{% block title %}Market{% endblock %}

{% block head %}<meta name="csrf-token" content="{{ csrf_token }}">{% endblock %}

{% block content %}
<div class="market-layout">
  <button type="button" class="panel-toggle" aria-expanded="true" aria-controls="panel">Panel</button>
  <section id="chart" aria-label="Candlestick chart"></section>
  <aside class="panel" id="panel">
    <h1>Market</h1>
    <h2>Pairs</h2>
    <nav class="pairs">
      {% for symbol in symbols %}
      <button type="button" class="pair" data-symbol="{{ symbol }}">{{ symbol }}</button>
      {% endfor %}
    </nav>
    <h2>Interval</h2>
    <select id="interval" aria-label="Interval">
      <option value="1m">1m</option>
      <option value="5m">5m</option>
      <option value="15m">15m</option>
      <option value="30m">30m</option>
      <option value="1h">1h</option>
      <option value="2h">2h</option>
      <option value="4h">4h</option>
      <option value="6h">6h</option>
      <option value="8h">8h</option>
      <option value="12h">12h</option>
      <option value="1d">1d</option>
      <option value="3d">3d</option>
      <option value="1w">1w</option>
      <option value="1M">1M</option>
    </select>
    <h2 id="indicators-heading">Indicators</h2>
    <fieldset class="indicators" aria-labelledby="indicators-heading">
      <label><input type="checkbox" class="indicator-toggle" value="sma" checked> SMA
        <input type="number" class="indicator-param" data-token="sma" data-param="sma_len" min="1" value="20" aria-label="SMA length"></label>
      <label><input type="checkbox" class="indicator-toggle" value="ema" checked> EMA
        <input type="number" class="indicator-param" data-token="ema" data-param="ema_len" min="1" value="20" aria-label="EMA length"></label>
      <label><input type="checkbox" class="indicator-toggle" value="bollinger"> Bollinger</label>
      <label><input type="checkbox" class="indicator-toggle" value="vwap"> VWAP</label>
      <label><input type="checkbox" class="indicator-toggle" value="rsi" checked> RSI</label>
      <label><input type="checkbox" class="indicator-toggle" value="macd"> MACD</label>
      <label><input type="checkbox" class="indicator-toggle" value="stochastic"> Stochastic</label>
      <label><input type="checkbox" class="indicator-toggle" value="atr"> ATR</label>
      <label><input type="checkbox" class="indicator-toggle" value="volume"> Volume</label>
    </fieldset>
    <h2>RSI (14)</h2>
    <p id="rsi" aria-live="polite">–</p>
    <h2 id="smc-heading">SMC overlay</h2>
    <fieldset class="smc" aria-labelledby="smc-heading">
      <label><input type="checkbox" class="smc-toggle" data-family="swings" checked> Swings</label>
      <label><input type="checkbox" class="smc-toggle" data-family="structure" checked> Structure</label>
      <label><input type="checkbox" class="smc-toggle" data-family="order_blocks" checked> Order blocks</label>
      <label><input type="checkbox" class="smc-toggle" data-family="fvg" checked> FVG</label>
      <label><input type="checkbox" class="smc-toggle" data-family="range" checked> Range</label>
      <label><input type="checkbox" class="smc-toggle" data-family="setups" checked> Setups</label>
    </fieldset>
    <h2 id="drawings-heading">Drawings</h2>
    <fieldset class="drawings" aria-labelledby="drawings-heading">
      <button type="button" class="draw-tool" data-kind="hline">H-line</button>
      <button type="button" class="draw-tool" data-kind="trendline">Trend</button>
      <button type="button" class="draw-tool" data-kind="fib">Fib</button>
      <button type="button" class="draw-tool" data-kind="rect">Box</button>
      <button type="button" class="draw-tool" data-kind="text">Text</button>
    </fieldset>
    <button type="button" class="draw-cancel">Pan / cancel</button>
    <ul id="drawing-list" class="drawing-list"></ul>
  </aside>
</div>

<dialog id="text-dialog" aria-label="Text drawing">
  <form method="dialog">
    <label for="text-dialog-input">Label</label>
    <input id="text-dialog-input" type="text" maxlength="80" autocomplete="off">
    <button type="submit" value="ok">Add</button>
    <button type="submit" value="cancel">Cancel</button>
  </form>
</dialog>
{% endblock %}

{% block scripts %}
<script src="https://unpkg.com/lightweight-charts@5.2.0/dist/lightweight-charts.standalone.production.js"></script>
<link rel="modulepreload" href="{% url 'market_chart_module_js' name='chart-core' %}">
<link rel="modulepreload" href="{% url 'market_chart_module_js' name='drawing-core' %}">
<link rel="modulepreload" href="{% url 'market_chart_module_js' name='smc-overlay-core' %}">
<link rel="modulepreload" href="{% url 'market_chart_module_js' name='legend-core' %}">
<link rel="modulepreload" href="{% url 'market_chart_module_js' name='chart-store' %}">
<link rel="modulepreload" href="{% url 'market_chart_module_js' name='chart-bus' %}">
<link rel="modulepreload" href="{% url 'market_chart_module_js' name='chart-host' %}">
<link rel="modulepreload" href="{% url 'market_chart_module_js' name='main' %}">
<link rel="modulepreload" href="{% url 'market_controller_js' name='indicators' %}">
<link rel="modulepreload" href="{% url 'market_controller_js' name='history' %}">
<link rel="modulepreload" href="{% url 'market_controller_js' name='stream' %}">
<link rel="modulepreload" href="{% url 'market_controller_js' name='drawings' %}">
<link rel="modulepreload" href="{% url 'market_controller_js' name='smc' %}">
<link rel="modulepreload" href="{% url 'market_controller_js' name='toolbar' %}">
<link rel="modulepreload" href="{% url 'market_controller_js' name='legend' %}">
<script type="module" src="{% url 'market_chart_js' %}"></script>
{% endblock %}
